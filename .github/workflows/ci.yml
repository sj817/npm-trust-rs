name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The dev toolchain needs Node >= 22 (vitest, tsdown), but the bundle targets
  # node18 and the runtime deps support it. Build on a modern Node, then check the
  # packed artifact actually installs and starts on the oldest Node `engines` promises.
  engines:
    name: engines (Node 18 artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install the tarball on Node 18 and run it
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/qwqo-npm-trust-*.tgz
          ./node_modules/.bin/npt --version
          node --input-type=module -e "
            const m = await import('@qwqo/npm-trust')
            if (typeof m.githubTrust !== 'function') throw new Error('missing library export')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lockfile hygiene
        run: node scripts/check-lockfile.mjs

      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
