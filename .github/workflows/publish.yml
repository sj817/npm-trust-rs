name: Publish

# Publish `@qwqo/npm-trust` to npm via OIDC Trusted Publishing (tokenless).
#
# Release flow — the tag is what publishes:
#   1. bump "version" in package.json
#   2. git commit -m "v0.2.0"
#   3. git tag v0.2.0 && git push origin main --follow-tags
#
# The tag must match package.json; the job refuses to publish otherwise. The
# GitHub Release is created from the tag after a successful publish.
#
# `workflow_dispatch` is for re-running a failed publish: dispatch it against the
# tag, not a branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing (OIDC) — tokenless publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so --generate-notes can diff against the previous tag

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm >= 11.5, which supports OIDC publish
          registry-url: https://registry.npmjs.org

      - name: Verify the tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::this workflow must run on a tag, got $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg from $GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish # no NODE_AUTH_TOKEN — tokenless via OIDC

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
