name: Release npm packages

# Build the native binary for every supported platform, assemble the per-platform
# npm sub-packages, and publish them + the main `@qwqojs/npt` launcher.
#
# Trigger by pushing a tag like `v0.1.0`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: npt.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, bin: npt.exe }
          - { os: macos-13, target: x86_64-apple-darwin, bin: npt }
          - { os: macos-14, target: aarch64-apple-darwin, bin: npt }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: npt }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, bin: npt, linker: aarch64-linux-gnu-gcc, apt: gcc-aarch64-linux-gnu }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux arm64)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p npt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: assemble & publish
    needs: build
    runs-on: ubuntu-latest
    # For npm Trusted Publishing (OIDC) instead of a token, uncomment:
    # permissions:
    #   id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC publish needs >= 11.5)
        run: npm install -g npm@latest

      - name: Assemble & publish
        run: node scripts/assemble-npm.mjs --artifacts artifacts --version "${GITHUB_REF_NAME#v}" --publish
        env:
          # Use a token; or switch to OIDC by enabling id-token: write above and
          # configuring Trusted Publishing for these packages on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
